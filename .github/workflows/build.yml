name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly rebuild to pick up PHP and Debian security fixes
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write   # publish releases and commit CHANGELOG.md
  packages: write

# Never run two builds of main at once (releases and the CHANGELOG commit would race)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dschoepel/baikal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read versions from Dockerfile
        id: v
        run: |
          baikal=$(sed -n 's/^ARG BAIKAL_VERSION=//p' Dockerfile)
          minphp=$(sed -n 's/^ARG MIN_PHP_VERSION=//p' Dockerfile)
          echo "baikal=$baikal" >> "$GITHUB_OUTPUT"
          php=$(sed -n 's/^ARG PHP_VERSION=//p' Dockerfile)
          echo "minphp=$minphp" >> "$GITHUB_OUTPUT"
          echo "php=$php" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # arm64 is only built once the Sury repo has a PHP build for it that meets
      # MIN_PHP_VERSION. Until then, build amd64 alone instead of failing.
      - name: Pick platforms
        id: p
        run: |
          codename=$(docker run --rm nginx:1 sh -c '. /etc/os-release; echo $VERSION_CODENAME')
          arm=$(curl -fsSL "https://packages.sury.org/php/dists/$codename/main/binary-arm64/Packages.gz" | gunzip             | awk '/^Package: php${{ steps.v.outputs.php }}-fpm$/{p=1} p&&/^Version:/{print $2;p=0}' | sort -V | tail -1)
          echo "arm64 php${{ steps.v.outputs.php }}-fpm on $codename: ${arm:-none}"
          if [ -n "$arm" ] && dpkg --compare-versions "$arm" ge "${{ steps.v.outputs.minphp }}"; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "arm64=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::arm64 skipped: PHP ${arm:-none} is older than ${{ steps.v.outputs.minphp }}"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "arm64=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
        if: steps.p.outputs.arm64 == 'true'

      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          load: true
          tags: baikal:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        id: smoke
        run: |
          set -euo pipefail
          docker run -d --name baikal -p 8080:80 baikal:test
          trap 'docker logs baikal' ERR

          # Wait for nginx + PHP-FPM
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

          php_version=$(docker exec baikal php -r 'echo PHP_VERSION;')
          echo "PHP: $php_version"
          echo "php_full=$php_version" >> "$GITHUB_OUTPUT"
          docker exec baikal php -r "exit(version_compare(PHP_VERSION, '${{ steps.v.outputs.minphp }}', '>=') ? 0 : 1);"

          modules=$(docker exec baikal php -m)
          for m in pdo_mysql pdo_sqlite pgsql; do
            echo "$modules" | grep -qx "$m" || { echo "Missing PHP module: $m"; exit 1; }
          done

          baikal_version=$(docker exec baikal php -r 'require "/var/www/baikal/Core/Distrib.php"; echo BAIKAL_VERSION;')
          echo "Baikal: $baikal_version"
          [ "$baikal_version" = "${{ steps.v.outputs.baikal }}" ]

          owner=$(docker exec baikal stat -c %U /var/www/baikal)
          [ "$owner" = "nginx" ] || { echo "/var/www/baikal owned by $owner"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/dav.php/)
          echo "dav.php: HTTP $code"
          [ "$code" -lt 500 ]

          # Admin installer page must render through PHP-FPM
          curl -fsSL http://localhost:8080/admin/install/ | grep -qi 'baikal\|ba&iuml;kal\|baïkal'

          {
            echo "### Smoke test passed"
            echo "- PHP: \`$php_version\`"
            echo "- Baïkal: \`$baikal_version\`"
            echo "- dav.php: HTTP $code"
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f baikal

      # Decide whether this build is a new release (new Baïkal/PHP version, or unreleased
      # notes in CHANGELOG.md). Empty version = no release, just refresh the rolling tags.
      - name: Plan release
        id: rel
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BAIKAL_VERSION: ${{ steps.v.outputs.baikal }}
          PHP_VERSION: ${{ steps.smoke.outputs.php_full }}
          PLATFORMS: ${{ steps.p.outputs.platforms }}
        run: |
          python3 .github/scripts/release.py plan | tee -a "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ steps.p.outputs.platforms }}
          push: true
          pull: true
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.baikal }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.baikal }}-php${{ steps.v.outputs.php }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.v.outputs.sha }}
            ${{ steps.rel.outputs.version && format('{0}:{1}', env.IMAGE, steps.rel.outputs.version) || '' }}

      # The Dockerfile already refuses a PHP older than MIN_PHP_VERSION on every
      # platform; this double-checks the pushed arm64 image under emulation.
      - name: Check arm64 image
        if: github.event_name != 'pull_request' && steps.p.outputs.arm64 == 'true'
        run: |
          set -euo pipefail
          img=${{ env.IMAGE }}:sha-${{ steps.v.outputs.sha }}
          docker run --rm --platform linux/arm64 "$img" uname -m | grep -qx aarch64
          php_version=$(docker run --rm --platform linux/arm64 "$img" php -r 'echo PHP_VERSION;')
          echo "arm64 PHP: $php_version"
          docker run --rm --platform linux/arm64 "$img" php -r "exit(version_compare(PHP_VERSION, '${{ steps.v.outputs.minphp }}', '>=') ? 0 : 1);"
          modules=$(docker run --rm --platform linux/arm64 "$img" php -m)
          for m in pdo_mysql pdo_sqlite pgsql; do echo "$modules" | grep -qx "$m"; done
          echo "- arm64 PHP: \`$php_version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: steps.rel.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.rel.outputs.version }}
          BAIKAL_VERSION: ${{ steps.v.outputs.baikal }}
          PHP_VERSION: ${{ steps.smoke.outputs.php_full }}
          PLATFORMS: ${{ steps.p.outputs.platforms }}
          IMAGE: ${{ env.IMAGE }}
          DIGEST: ${{ steps.push.outputs.digest }}
          COMMIT: ${{ github.sha }}
        run: python3 .github/scripts/release.py publish

      - name: Release summary
        if: steps.rel.outputs.version != ''
        run: |
          echo "- Release: [${{ steps.rel.outputs.version }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.rel.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"
